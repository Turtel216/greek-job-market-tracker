# Unit tests for the marts. They run in `dbt build` before the model they
# test. The jobs here have several postings each, as deduplication gives
# them, so the rules for merging postings are covered.

unit_tests:
  - name: dim_jobs_primary_posting
    description: >
      The primary posting is an ATS one over a job board one, then the one
      that knows the most attributes, then the earliest seen. The salary
      comes from the earliest posting that states one, even if it is not
      the primary. A job is open while any posting is open, and closes on
      the newest closed_date of its postings. It opened on the earliest
      opened_date of its postings, and days_open counts from there.
    model: dim_jobs
    given:
      - input: ref('int_job_matches')
        rows:
          - {posting_key: p1, job_id: p1}
          - {posting_key: p2, job_id: p1}
          - {posting_key: p3, job_id: p1}
          - {posting_key: p4, job_id: p5}
          - {posting_key: p5, job_id: p5}
          - {posting_key: p6, job_id: p7}
          - {posting_key: p7, job_id: p7}
      - input: ref('stg_postings')
        rows:
          # Job p1: the greenhouse posting is primary although p1 knows as much
          - {posting_key: p1, source: kariera, title: Backend Developer, company_name: Acme, role_family: backend, seniority: senior, work_mode: onsite, city: Athens, region: Attica}
          - {posting_key: p2, source: greenhouse, title: Senior Backend Engineer, company_name: Acme S.A., role_family: backend, seniority: senior, work_mode: hybrid, city: Athens, region: Attica, salary_min_monthly: 2000, salary_max_monthly: 2500, salary_currency: EUR, salary_basis: gross}
          - {posting_key: p3, source: kariera, title: Backend Engineer, company_name: Acme, role_family: backend, seniority: unknown, work_mode: unknown, city: Unknown, region: Unknown, salary_min_monthly: 1800, salary_max_monthly: 2000, salary_currency: EUR, salary_basis: net}
          # Job p5: p4 knows the city, so it wins over the earlier p5
          - {posting_key: p4, source: kariera, title: Data Engineer, company_name: Beta, role_family: data, seniority: unknown, work_mode: remote, city: Thessaloniki, region: Central Macedonia}
          - {posting_key: p5, source: kariera, title: Data Engineer (Remote), company_name: Beta, role_family: data, seniority: unknown, work_mode: remote, city: Unknown, region: Unknown}
          # Job p7: both know as much, so the earlier p7 wins
          - {posting_key: p6, source: kariera, title: QA Engineer, company_name: Gamma, role_family: qa, seniority: junior, work_mode: onsite, city: Patras, region: Western Greece}
          - {posting_key: p7, source: kariera, title: QA Tester, company_name: Gamma, role_family: qa, seniority: junior, work_mode: onsite, city: Patras, region: Western Greece}
      - input: ref('int_posting_lifecycle')
        rows:
          # p3 was posted before tracking began
          - {posting_key: p1, posted_at: "2026-10-01", opened_date: "2026-10-01", first_seen: "2026-10-01", last_seen: "2026-10-05", is_open: false, closed_date: "2026-10-06"}
          - {posting_key: p2, posted_at: null, opened_date: "2026-10-03", first_seen: "2026-10-03", last_seen: "2026-10-20", is_open: true, closed_date: null}
          - {posting_key: p3, posted_at: "2026-09-25", opened_date: "2026-09-25", first_seen: "2026-10-02", last_seen: "2026-10-19", is_open: true, closed_date: null}
          # No posted dates
          - {posting_key: p4, posted_at: null, opened_date: "2026-10-04", first_seen: "2026-10-04", last_seen: "2026-10-10", is_open: false, closed_date: "2026-10-12"}
          - {posting_key: p5, posted_at: null, opened_date: "2026-10-02", first_seen: "2026-10-02", last_seen: "2026-10-08", is_open: false, closed_date: "2026-10-09"}
          # p6 was posted after p7 was first seen
          - {posting_key: p6, posted_at: "2026-10-04", opened_date: "2026-10-04", first_seen: "2026-10-05", last_seen: "2026-10-20", is_open: true, closed_date: null}
          - {posting_key: p7, posted_at: null, opened_date: "2026-10-03", first_seen: "2026-10-03", last_seen: "2026-10-19", is_open: true, closed_date: null}
    expect:
      rows:
        - {job_id: p1, title: Senior Backend Engineer, company_name: Acme S.A., role_family: backend, seniority: senior, work_mode: hybrid, city: Athens, region: Attica, salary_min_monthly: 1800, salary_max_monthly: 2000, salary_currency: EUR, salary_basis: net, source_count: 2, posted_at: "2026-09-25", opened_date: "2026-09-25", first_seen: "2026-10-01", last_seen: "2026-10-20", closed_date: null, is_open: true, days_open: 26}
        - {job_id: p5, title: Data Engineer, company_name: Beta, role_family: data, seniority: unknown, work_mode: remote, city: Thessaloniki, region: Central Macedonia, salary_min_monthly: null, salary_max_monthly: null, salary_currency: null, salary_basis: null, source_count: 1, posted_at: null, opened_date: "2026-10-02", first_seen: "2026-10-02", last_seen: "2026-10-10", closed_date: "2026-10-12", is_open: false, days_open: 9}
        - {job_id: p7, title: QA Tester, company_name: Gamma, role_family: qa, seniority: junior, work_mode: onsite, city: Patras, region: Western Greece, salary_min_monthly: null, salary_max_monthly: null, salary_currency: null, salary_basis: null, source_count: 1, posted_at: "2026-10-04", opened_date: "2026-10-03", first_seen: "2026-10-03", last_seen: "2026-10-20", closed_date: null, is_open: true, days_open: 18}

  - name: bridge_job_skills_union
    description: >
      A job has every skill of its postings once, with title when any of
      them has the skill in the title.
    model: bridge_job_skills
    given:
      - input: ref('int_job_matches')
        rows:
          - {posting_key: p1, job_id: p1}
          - {posting_key: p2, job_id: p1}
          - {posting_key: p3, job_id: p3}
      - input: ref('int_posting_skills')
        rows:
          - {posting_key: p1, skill_id: python, matched_in: description}
          - {posting_key: p2, skill_id: python, matched_in: title}
          - {posting_key: p1, skill_id: sql, matched_in: description}
          - {posting_key: p2, skill_id: sql, matched_in: description}
          - {posting_key: p2, skill_id: docker, matched_in: description}
          - {posting_key: p3, skill_id: python, matched_in: description}
    expect:
      rows:
        - {job_id: p1, skill_id: python, matched_in: title}
        - {job_id: p1, skill_id: sql, matched_in: description}
        - {job_id: p1, skill_id: docker, matched_in: description}
        - {job_id: p3, skill_id: python, matched_in: description}

  - name: fct_daily_postings_spine
    description: >
      Every role family and city gets a row for every day, with zeros on
      quiet days. A job is new on its opened_date and open from then until
      the day before its closed_date. A job that opened before tracking
      began is open from the first day but never new. A job first seen
      after it opened, such as on the first run of a new source, is new on
      the day it opened. Remote jobs count under Remote, whatever their city.
    model: fct_daily_postings
    given:
      - input: ref('dim_jobs')
        rows:
          - {job_id: j1, role_family: backend, work_mode: onsite, city: Athens, opened_date: "2026-10-01", first_seen: "2026-10-01", last_seen: "2026-10-02", closed_date: "2026-10-03"}
          - {job_id: j2, role_family: backend, work_mode: remote, city: Athens, opened_date: "2026-10-02", first_seen: "2026-10-02", last_seen: "2026-10-04", closed_date: null}
          - {job_id: j3, role_family: data, work_mode: hybrid, city: Unknown, opened_date: "2026-10-01", first_seen: "2026-10-01", last_seen: "2026-10-04", closed_date: null}
          - {job_id: j4, role_family: backend, work_mode: onsite, city: Athens, opened_date: "2026-10-03", first_seen: "2026-10-03", last_seen: "2026-10-04", closed_date: null}
          # Open before tracking began
          - {job_id: j5, role_family: data, work_mode: onsite, city: Unknown, opened_date: "2026-09-15", first_seen: "2026-10-02", last_seen: "2026-10-03", closed_date: "2026-10-04"}
          # Opened on the 2nd, first seen on the 4th when its source was added
          - {job_id: j6, role_family: backend, work_mode: onsite, city: Athens, opened_date: "2026-10-02", first_seen: "2026-10-04", last_seen: "2026-10-04", closed_date: null}
    expect:
      rows:
        - {date: "2026-10-01", role_family: backend, city: Athens, new_postings: 1, open_postings: 1, closed_postings: 0}
        - {date: "2026-10-02", role_family: backend, city: Athens, new_postings: 1, open_postings: 2, closed_postings: 0}
        - {date: "2026-10-03", role_family: backend, city: Athens, new_postings: 1, open_postings: 2, closed_postings: 1}
        - {date: "2026-10-04", role_family: backend, city: Athens, new_postings: 0, open_postings: 2, closed_postings: 0}
        - {date: "2026-10-01", role_family: backend, city: Remote, new_postings: 0, open_postings: 0, closed_postings: 0}
        - {date: "2026-10-02", role_family: backend, city: Remote, new_postings: 1, open_postings: 1, closed_postings: 0}
        - {date: "2026-10-03", role_family: backend, city: Remote, new_postings: 0, open_postings: 1, closed_postings: 0}
        - {date: "2026-10-04", role_family: backend, city: Remote, new_postings: 0, open_postings: 1, closed_postings: 0}
        - {date: "2026-10-01", role_family: data, city: Unknown, new_postings: 1, open_postings: 2, closed_postings: 0}
        - {date: "2026-10-02", role_family: data, city: Unknown, new_postings: 0, open_postings: 2, closed_postings: 0}
        - {date: "2026-10-03", role_family: data, city: Unknown, new_postings: 0, open_postings: 2, closed_postings: 0}
        - {date: "2026-10-04", role_family: data, city: Unknown, new_postings: 0, open_postings: 1, closed_postings: 1}

  - name: fct_monthly_skill_demand_open_months
    description: >
      A job counts in every month from the one it opened in to the one
      before it closed, so a job that closed on the 1st does not count in
      that month. A job that opened before it was first seen counts from the
      month it opened, but months start with the first month a job was
      seen. Every skill gets a row for each month and role family with open
      jobs, with zero when no job asks for it.
    model: fct_monthly_skill_demand
    given:
      - input: ref('dim_jobs')
        rows:
          # September only: closed on the first day of October
          - {job_id: j1, role_family: backend, opened_date: "2026-09-20", first_seen: "2026-09-20", last_seen: "2026-09-30", closed_date: "2026-10-01"}
          # September to November, still open
          - {job_id: j2, role_family: backend, opened_date: "2026-09-25", first_seen: "2026-09-25", last_seen: "2026-11-05", closed_date: null}
          # October only
          - {job_id: j3, role_family: data, opened_date: "2026-10-15", first_seen: "2026-10-15", last_seen: "2026-10-31", closed_date: "2026-11-01"}
          # November, with no skills
          - {job_id: j4, role_family: backend, opened_date: "2026-11-02", first_seen: "2026-11-02", last_seen: "2026-11-05", closed_date: null}
          # Opened in August, first seen in October: September and October
          - {job_id: j5, role_family: data, opened_date: "2026-08-10", first_seen: "2026-10-20", last_seen: "2026-10-24", closed_date: "2026-10-25"}
      - input: ref('bridge_job_skills')
        rows:
          - {job_id: j1, skill_id: python}
          - {job_id: j1, skill_id: sql}
          - {job_id: j2, skill_id: python}
          - {job_id: j3, skill_id: sql}
          - {job_id: j5, skill_id: sql}
      - input: ref('dim_skills')
        rows:
          - {skill_id: python}
          - {skill_id: sql}
    expect:
      rows:
        - {month: "2026-09-01", skill_id: python, role_family: backend, jobs_with_skill: 2, jobs_total: 2, share_of_jobs: "1.0000"}
        - {month: "2026-09-01", skill_id: sql, role_family: backend, jobs_with_skill: 1, jobs_total: 2, share_of_jobs: "0.5000"}
        - {month: "2026-09-01", skill_id: python, role_family: data, jobs_with_skill: 0, jobs_total: 1, share_of_jobs: "0.0000"}
        - {month: "2026-09-01", skill_id: sql, role_family: data, jobs_with_skill: 1, jobs_total: 1, share_of_jobs: "1.0000"}
        - {month: "2026-10-01", skill_id: python, role_family: backend, jobs_with_skill: 1, jobs_total: 1, share_of_jobs: "1.0000"}
        - {month: "2026-10-01", skill_id: sql, role_family: backend, jobs_with_skill: 0, jobs_total: 1, share_of_jobs: "0.0000"}
        - {month: "2026-10-01", skill_id: python, role_family: data, jobs_with_skill: 0, jobs_total: 2, share_of_jobs: "0.0000"}
        - {month: "2026-10-01", skill_id: sql, role_family: data, jobs_with_skill: 2, jobs_total: 2, share_of_jobs: "1.0000"}
        - {month: "2026-11-01", skill_id: python, role_family: backend, jobs_with_skill: 1, jobs_total: 2, share_of_jobs: "0.5000"}
        - {month: "2026-11-01", skill_id: sql, role_family: backend, jobs_with_skill: 0, jobs_total: 2, share_of_jobs: "0.0000"}
