[project]
name = "jobtracker-ingest"
version = "0.1.0"
description = "Ingestion package for the Greek Tech Job Market Tracker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4==4.15.0",
    "boto3==1.43.118",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "structlog==26.1.0",
]

[project.scripts]
jobtracker = "jobtracker_ingest.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "responses==0.26.3",
    "ruff==0.17.2",
    "types-boto3[s3]==1.43.118",
    "types-pyyaml==6.0.12.20260906",
    "types-requests==2.33.0.20261006",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
