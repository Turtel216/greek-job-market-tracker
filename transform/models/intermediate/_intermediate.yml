models:
  - name: int_posting_lifecycle
    description: >
      When each posting was first and last seen, and whether it is still
      open. A posting closes once it is missing from missed_runs_to_close
      (2) successful runs of its source in a row; closed_date is the first
      of those runs. Only runs with a succeeded row in ops.ingest_runs
      count, so a failed run never closes anything (ADR-003). A posting
      that comes back after closing is open again.
    columns:
      - name: posting_key
        description: Primary key. md5 of source and source_job_id.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_postings')
                field: posting_key
      - name: source
        description: Source name from config/sources.yml.
        data_tests:
          - not_null
      - name: first_seen
        description: run_date of the first run that saw the posting.
        data_tests:
          - not_null
      - name: last_seen
        description: run_date of the newest run that saw the posting.
        data_tests:
          - not_null
      - name: missed_runs
        description: Successful runs of the source since the posting was last seen.
        data_tests:
          - not_null
      - name: is_open
        description: True while the posting has missed fewer than missed_runs_to_close runs.
        data_tests:
          - not_null
      - name: closed_date
        description: The first successful run the posting was missing from. Null while open.

  - name: int_posting_skills
    description: >
      Skills found in each posting. An alias from skill_aliases matches the
      normalized title or description when it stands alone, using the
      boundary (^|[^a-z0-9+#.])alias($|[^a-z0-9+#]), or its pattern_override
      when it has one. One row per posting and skill.
    data_tests:
      - unique_combination:
          arguments:
            columns: [posting_key, skill_id]
    columns:
      - name: posting_key
        description: The posting.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_postings')
                field: posting_key
      - name: skill_id
        description: The skill found.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('skills')
                field: skill_id
      - name: matched_in
        description: title when an alias is in the title, else description.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [title, description]

  - name: int_job_candidate_pairs
    description: >
      Pairs of postings that look like the same job. Both postings have the
      same company_key, were first seen at most dedup_window_days (30) days
      apart, and have a title similarity from pg_trgm of at least
      dedup_title_threshold (0.6). Their cities match unless one is Unknown
      or either posting is remote, and their seniorities match unless one is
      unknown. One row per pair, with the smaller posting_key first.
    data_tests:
      - unique_combination:
          arguments:
            columns: [posting_key_a, posting_key_b]
    columns:
      - name: posting_key_a
        description: The posting with the smaller key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_postings')
                field: posting_key
      - name: posting_key_b
        description: The posting with the larger key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_postings')
                field: posting_key
      - name: company_key
        description: The company both postings belong to.
        data_tests:
          - not_null
      - name: title_similarity
        description: pg_trgm similarity of the two normalized titles, from 0 to 1.
        data_tests:
          - not_null

  - name: int_job_matches
    description: >
      The real-world job each posting belongs to, one row per posting.
      Postings joined by int_job_candidate_pairs, directly or through other
      postings, form one cluster. job_id is the posting_key of the member
      with the earliest first_seen, ties broken by posting_key (ADR-004). A
      posting with no pair is its own cluster, so its job_id is its
      posting_key.
    columns:
      - name: posting_key
        description: Primary key. The posting.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_postings')
                field: posting_key
      - name: job_id
        description: The job, as the posting_key of the earliest posting in its cluster.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_job_matches')
                field: posting_key
