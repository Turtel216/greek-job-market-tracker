# Connection settings, all read from the environment. dbt connects as the
# transformer role (see infra/postgres/init). The defaults suit a laptop
# with the Compose stack running.
jobtracker:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: transformer
      password: "{{ env_var('TRANSFORMER_PASSWORD', '') }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'warehouse') }}"
      schema: staging
      threads: "{{ env_var('DBT_THREADS', '4') | as_number }}"
