# Unit tests for the marts. They run in `dbt build` before the model they
# test. The jobs here have several postings each, as they will once
# deduplication lands, so the rules for merging postings are covered now.

unit_tests:
  - name: dim_jobs_primary_posting
    description: >
      The primary posting is an ATS one over a job board one, then the one
      that knows the most attributes, then the earliest seen. The salary
      comes from the earliest posting that states one, even if it is not
      the primary. A job is open while any posting is open, and closes on
      the newest closed_date of its postings.
    model: dim_jobs
    given:
      - input: ref('int_job_matches')
        rows:
          - {posting_key: p1, job_id: p1}
          - {posting_key: p2, job_id: p1}
          - {posting_key: p3, job_id: p1}
          - {posting_key: p4, job_id: p5}
          - {posting_key: p5, job_id: p5}
          - {posting_key: p6, job_id: p7}
          - {posting_key: p7, job_id: p7}
      - input: ref('stg_postings')
        rows:
          # Job p1: the greenhouse posting is primary although p1 knows as much
          - {posting_key: p1, source: kariera, title: Backend Developer, company_name: Acme, role_family: backend, seniority: senior, work_mode: onsite, city: Athens, region: Attica}
          - {posting_key: p2, source: greenhouse, title: Senior Backend Engineer, company_name: Acme S.A., role_family: backend, seniority: senior, work_mode: hybrid, city: Athens, region: Attica, salary_min_monthly: 2000, salary_max_monthly: 2500, salary_currency: EUR, salary_basis: gross}
          - {posting_key: p3, source: kariera, title: Backend Engineer, company_name: Acme, role_family: backend, seniority: unknown, work_mode: unknown, city: Unknown, region: Unknown, salary_min_monthly: 1800, salary_max_monthly: 2000, salary_currency: EUR, salary_basis: net}
          # Job p5: p4 knows the city, so it wins over the earlier p5
          - {posting_key: p4, source: kariera, title: Data Engineer, company_name: Beta, role_family: data, seniority: unknown, work_mode: remote, city: Thessaloniki, region: Central Macedonia}
          - {posting_key: p5, source: kariera, title: Data Engineer (Remote), company_name: Beta, role_family: data, seniority: unknown, work_mode: remote, city: Unknown, region: Unknown}
          # Job p7: both know as much, so the earlier p7 wins
          - {posting_key: p6, source: kariera, title: QA Engineer, company_name: Gamma, role_family: qa, seniority: junior, work_mode: onsite, city: Patras, region: Western Greece}
          - {posting_key: p7, source: kariera, title: QA Tester, company_name: Gamma, role_family: qa, seniority: junior, work_mode: onsite, city: Patras, region: Western Greece}
      - input: ref('int_posting_lifecycle')
        rows:
          - {posting_key: p1, first_seen: "2026-10-01", last_seen: "2026-10-05", is_open: false, closed_date: "2026-10-06"}
          - {posting_key: p2, first_seen: "2026-10-03", last_seen: "2026-10-20", is_open: true, closed_date: null}
          - {posting_key: p3, first_seen: "2026-10-02", last_seen: "2026-10-19", is_open: true, closed_date: null}
          - {posting_key: p4, first_seen: "2026-10-04", last_seen: "2026-10-10", is_open: false, closed_date: "2026-10-12"}
          - {posting_key: p5, first_seen: "2026-10-02", last_seen: "2026-10-08", is_open: false, closed_date: "2026-10-09"}
          - {posting_key: p6, first_seen: "2026-10-05", last_seen: "2026-10-20", is_open: true, closed_date: null}
          - {posting_key: p7, first_seen: "2026-10-03", last_seen: "2026-10-19", is_open: true, closed_date: null}
    expect:
      rows:
        - {job_id: p1, title: Senior Backend Engineer, company_name: Acme S.A., role_family: backend, seniority: senior, work_mode: hybrid, city: Athens, region: Attica, salary_min_monthly: 1800, salary_max_monthly: 2000, salary_currency: EUR, salary_basis: net, source_count: 2, first_seen: "2026-10-01", last_seen: "2026-10-20", closed_date: null, is_open: true, days_open: 20}
        - {job_id: p5, title: Data Engineer, company_name: Beta, role_family: data, seniority: unknown, work_mode: remote, city: Thessaloniki, region: Central Macedonia, salary_min_monthly: null, salary_max_monthly: null, salary_currency: null, salary_basis: null, source_count: 1, first_seen: "2026-10-02", last_seen: "2026-10-10", closed_date: "2026-10-12", is_open: false, days_open: 9}
        - {job_id: p7, title: QA Tester, company_name: Gamma, role_family: qa, seniority: junior, work_mode: onsite, city: Patras, region: Western Greece, salary_min_monthly: null, salary_max_monthly: null, salary_currency: null, salary_basis: null, source_count: 1, first_seen: "2026-10-03", last_seen: "2026-10-20", closed_date: null, is_open: true, days_open: 18}

  - name: bridge_job_skills_union
    description: >
      A job has every skill of its postings once, with title when any of
      them has the skill in the title.
    model: bridge_job_skills
    given:
      - input: ref('int_job_matches')
        rows:
          - {posting_key: p1, job_id: p1}
          - {posting_key: p2, job_id: p1}
          - {posting_key: p3, job_id: p3}
      - input: ref('int_posting_skills')
        rows:
          - {posting_key: p1, skill_id: python, matched_in: description}
          - {posting_key: p2, skill_id: python, matched_in: title}
          - {posting_key: p1, skill_id: sql, matched_in: description}
          - {posting_key: p2, skill_id: sql, matched_in: description}
          - {posting_key: p2, skill_id: docker, matched_in: description}
          - {posting_key: p3, skill_id: python, matched_in: description}
    expect:
      rows:
        - {job_id: p1, skill_id: python, matched_in: title}
        - {job_id: p1, skill_id: sql, matched_in: description}
        - {job_id: p1, skill_id: docker, matched_in: description}
        - {job_id: p3, skill_id: python, matched_in: description}
