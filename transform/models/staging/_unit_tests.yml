# Unit tests for the staging models. They run in `dbt build` before the
# model they test. A seed listed under given without rows uses the real
# seed file, so the rule tests check the seeds as well as the SQL.

unit_tests:
  - name: stg_raw_postings_keys_and_text
    description: posting_key is md5 of source and id; whitespace is tidied and empty text is null.
    model: stg_raw_postings
    given:
      - input: source('raw', 'raw_postings')
        rows:
          - raw_posting_id: 1
            source: kariera
            source_job_id: "3412"
            title_raw: "Backend   Developer\n(Java)"
            company_raw: "  Aegean Payments Α.Ε. "
            salary_raw: ""
            description_raw: "  Line one\nLine two  "
          - raw_posting_id: 2
            source: greenhouse
            source_job_id: "7001"
            title_raw: Senior Data Engineer
            company_raw: "   "
            salary_raw: "Base salary: 56000 - 70000 EUR"
            description_raw: ""
    expect:
      rows:
        - posting_key: 707c7653f4aab6dfd16c51b85a899090  # gitleaks:allow (md5, not a secret)
          raw_posting_id: 1
          title: Backend Developer (Java)
          company_name: Aegean Payments Α.Ε.
          salary_text: null
          description: "Line one\nLine two"
        - posting_key: 8a0d45a0ec9859624322e620162bd5bb  # gitleaks:allow (md5, not a secret)
          raw_posting_id: 2
          title: Senior Data Engineer
          company_name: null
          salary_text: "Base salary: 56000 - 70000 EUR"
          description: null

  - name: stg_postings_normalize_text
    description: >
      normalize_text lowercases, strips Greek and Latin accents, writes the
      final sigma as a normal one, keeps + # . and turns other punctuation
      into single spaces.
    model: stg_postings
    given:
      - input: ref('stg_raw_postings')
        rows:
          - posting_key: a
            title: "Προγραμματιστής C++/C# & .NET – Αθήνα"
            description: "Γνώσεις Python,\nSQL & Docker."
          - posting_key: b
            title: "  ΥΠΕΥΘΥΝΟΣ   Ανάπτυξης_Λογισμικού (Node.js)!! "
          - posting_key: c
            title: "Προϊστάμενος Ομάδας Ποιοτικού Ελέγχου"
          - posting_key: d
            title: "Ingénieur Données, Zürich"
          - posting_key: e
            title: "---"
      - input: ref('city_aliases')
      - input: ref('company_suffixes')
      - input: ref('company_aliases')
      - input: ref('work_mode_rules')
      - input: ref('seniority_rules')
      - input: ref('role_family_rules')
    expect:
      rows:
        - {posting_key: a, title_normalized: "προγραμματιστησ c++ c# .net αθηνα", description_text: "γνωσεισ python sql docker."}
        - {posting_key: b, title_normalized: "υπευθυνοσ αναπτυξησ λογισμικου node.js", description_text: null}
        - {posting_key: c, title_normalized: "προισταμενοσ ομαδασ ποιοτικου ελεγχου", description_text: null}
        - {posting_key: d, title_normalized: "ingenieur donnees zurich", description_text: null}
        - {posting_key: e, title_normalized: null, description_text: null}

  - name: stg_postings_latest_row
    description: Each posting keeps its newest raw row, and last_run_date is that row's run_date.
    model: stg_postings
    given:
      - input: ref('stg_raw_postings')
        rows:
          - {posting_key: a, run_date: "2026-10-20", title: Backend Developer, content_hash: old}
          - {posting_key: a, run_date: "2026-10-25", title: Senior Backend Developer, content_hash: new}
          - {posting_key: a, run_date: "2026-10-22", title: Backend Engineer, content_hash: middle}
          - {posting_key: b, run_date: "2026-10-21", title: QA Engineer, content_hash: only}
      - input: ref('city_aliases')
      - input: ref('company_suffixes')
      - input: ref('company_aliases')
      - input: ref('work_mode_rules')
      - input: ref('seniority_rules')
      - input: ref('role_family_rules')
    expect:
      rows:
        - {posting_key: a, title: Senior Backend Developer, content_hash: new, last_run_date: "2026-10-25"}
        - {posting_key: b, title: QA Engineer, content_hash: only, last_run_date: "2026-10-21"}

  - name: stg_postings_company_key
    description: >
      company_key drops dots and every legal suffix at the end of the name,
      then maps aliases to one key.
    model: stg_postings
    given:
      - input: ref('stg_raw_postings')
        rows:
          - {posting_key: a, company_name: "Aegean Payments Α.Ε."}
          - {posting_key: b, company_name: "ΟΤΕ Α.Ε."}
          - {posting_key: c, company_name: "Skroutz.gr"}
          - {posting_key: d, company_name: "Ionian Cloud Μονοπρόσωπη Ι.Κ.Ε."}
          - {posting_key: e, company_name: "Workable Software Ltd"}
          - {posting_key: f, company_name: "Netcompany-Intrasoft S.A."}
          - {posting_key: g, company_name: "S.A."}
          - {posting_key: h, company_name: null}
      - input: ref('city_aliases')
      - input: ref('company_suffixes')
      - input: ref('company_aliases')
      - input: ref('work_mode_rules')
      - input: ref('seniority_rules')
      - input: ref('role_family_rules')
    expect:
      rows:
        - {posting_key: a, company_key: aegean payments}
        - {posting_key: b, company_key: ote}
        - {posting_key: c, company_key: skroutz}
        - {posting_key: d, company_key: ionian cloud}
        - {posting_key: e, company_key: workable}
        - {posting_key: f, company_key: netcompany intrasoft}
        - {posting_key: g, company_key: sa}
        - {posting_key: h, company_key: null}

  - name: stg_postings_city
    description: >
      The location is tried before the title. The first place in the text
      wins, and of places that start at the same spot the longest. No
      match gives Unknown.
    model: stg_postings
    given:
      - input: ref('stg_raw_postings')
        rows:
          - {posting_key: a, location_text: "Αθήνα, Αττική, Ελλάδα; Θεσσαλονίκη, Ελλάδα"}
          - {posting_key: b, location_text: "Athens, Attica, Greece"}
          - {posting_key: c, location_text: "Μαρούσι"}
          - {posting_key: d, location_text: "Ηράκλειο Αττικής"}
          - {posting_key: e, location_text: "Νέο Ηράκλειο"}
          - {posting_key: f, location_text: "Ηράκλειο, Κρήτη"}
          - {posting_key: g, location_text: "Remote - Greece", title: "Backend Engineer (Thessaloniki)"}
          - {posting_key: h, location_text: "Πάτρα", title: "Data Analyst, Athens office"}
          - {posting_key: i, location_text: null, title: "Software Engineer"}
      - input: ref('city_aliases')
      - input: ref('company_suffixes')
      - input: ref('company_aliases')
      - input: ref('work_mode_rules')
      - input: ref('seniority_rules')
      - input: ref('role_family_rules')
    expect:
      rows:
        - {posting_key: a, city: Athens, region: Attica}
        - {posting_key: b, city: Athens, region: Attica}
        - {posting_key: c, city: Athens, region: Attica}
        - {posting_key: d, city: Athens, region: Attica}
        - {posting_key: e, city: Athens, region: Attica}
        - {posting_key: f, city: Heraklion, region: Crete}
        - {posting_key: g, city: Thessaloniki, region: Central Macedonia}
        - {posting_key: h, city: Patras, region: Western Greece}
        - {posting_key: i, city: Unknown, region: Unknown}

  - name: stg_postings_work_mode
    description: >
      The workplace field is tried first, then location, title and
      description; the first field with a match decides and the highest
      priority wins within it. Covers the kariera and Greenhouse values.
    model: stg_postings
    given:
      - input: ref('stg_raw_postings')
        rows:
          - {posting_key: a, workplace_text: FULLY_REMOTE}
          - {posting_key: b, workplace_text: PARTIALLY_REMOTE}
          - {posting_key: c, workplace_text: DISABLED, description: "Hybrid work, two days at home."}
          - {posting_key: d, workplace_text: TELECOMMUTE}
          - {posting_key: e, workplace_text: "Remote: Yes"}
          - {posting_key: f, workplace_text: "Remote: No", description: "Υβριδικό μοντέλο εργασίας."}
          - {posting_key: g, workplace_text: "Hybrid, On-site"}
          - {posting_key: h, location_text: "Remote - Greece"}
          - {posting_key: i, title: "Java Developer", description: "Πλήρης τηλεργασία από όπου θέλεις."}
          - {posting_key: j, title: "Java Developer", description: "Εργασία εξ αποστάσεως ή στο γραφείο."}
          - {posting_key: k, description: "We welcome disabled applicants."}
          - {posting_key: l, title: "Java Developer"}
      - input: ref('city_aliases')
      - input: ref('company_suffixes')
      - input: ref('company_aliases')
      - input: ref('work_mode_rules')
      - input: ref('seniority_rules')
      - input: ref('role_family_rules')
    expect:
      rows:
        - {posting_key: a, work_mode: remote}
        - {posting_key: b, work_mode: hybrid}
        - {posting_key: c, work_mode: onsite}
        - {posting_key: d, work_mode: remote}
        - {posting_key: e, work_mode: remote}
        - {posting_key: f, work_mode: hybrid}
        - {posting_key: g, work_mode: hybrid}
        - {posting_key: h, work_mode: remote}
        - {posting_key: i, work_mode: remote}
        - {posting_key: j, work_mode: remote}
        - {posting_key: k, work_mode: unknown}
        - {posting_key: l, work_mode: unknown}

  - name: stg_postings_seniority
    description: Seniority comes from the title only, and a title with no signal is unknown, not mid.
    model: stg_postings
    given:
      - input: ref('stg_raw_postings')
        rows:
          - {posting_key: a, title: "Senior Backend Engineer"}
          - {posting_key: b, title: "Sr. Data Engineer"}
          - {posting_key: c, title: "Senior Team Lead"}
          - {posting_key: d, title: "Staff Engineer"}
          - {posting_key: e, title: "Πρακτική Άσκηση - Junior Developer"}
          - {posting_key: f, title: "Νέος Απόφοιτος Μηχανικός Λογισμικού"}
          - {posting_key: g, title: "Mid-level Frontend Developer"}
          - {posting_key: h, title: "Internal Tools Developer"}
          - {posting_key: i, title: "Software Engineer", description: "Senior role, 5+ years."}
      - input: ref('city_aliases')
      - input: ref('company_suffixes')
      - input: ref('company_aliases')
      - input: ref('work_mode_rules')
      - input: ref('seniority_rules')
      - input: ref('role_family_rules')
    expect:
      rows:
        - {posting_key: a, seniority: senior}
        - {posting_key: b, seniority: senior}
        - {posting_key: c, seniority: lead}
        - {posting_key: d, seniority: lead}
        - {posting_key: e, seniority: intern}
        - {posting_key: f, seniority: junior}
        - {posting_key: g, seniority: mid}
        - {posting_key: h, seniority: unknown}
        - {posting_key: i, seniority: unknown}

  - name: stg_postings_role_family
    description: Role family comes from the title, then the department; no match gives other.
    model: stg_postings
    given:
      - input: ref('stg_raw_postings')
        rows:
          - {posting_key: a, title: "Full-Stack Developer"}
          - {posting_key: b, title: "React Native Developer"}
          - {posting_key: c, title: "React Developer"}
          - {posting_key: d, title: "Μηχανικός Δεδομένων"}
          - {posting_key: e, title: "DevOps / SRE Engineer"}
          - {posting_key: f, title: "QA Automation Engineer"}
          - {posting_key: g, title: ".NET Developer"}
          - {posting_key: h, title: "Java Developer"}
          - {posting_key: i, title: "JavaScript Developer"}
          - {posting_key: j, title: "Software Engineer", department: "Data Platform"}
          - {posting_key: k, title: "Senior Engineer (Android)", department: "Data Platform"}
          - {posting_key: l, title: "Software Engineer", department: "IT"}
          - {posting_key: m, title: "Product Manager"}
      - input: ref('city_aliases')
      - input: ref('company_suffixes')
      - input: ref('company_aliases')
      - input: ref('work_mode_rules')
      - input: ref('seniority_rules')
      - input: ref('role_family_rules')
    expect:
      rows:
        - {posting_key: a, role_family: fullstack}
        - {posting_key: b, role_family: mobile}
        - {posting_key: c, role_family: frontend}
        - {posting_key: d, role_family: data}
        - {posting_key: e, role_family: devops}
        - {posting_key: f, role_family: qa}
        - {posting_key: g, role_family: backend}
        - {posting_key: h, role_family: backend}
        - {posting_key: i, role_family: other}
        - {posting_key: j, role_family: data}
        - {posting_key: k, role_family: mobile}
        - {posting_key: l, role_family: other}
        - {posting_key: m, role_family: other}
