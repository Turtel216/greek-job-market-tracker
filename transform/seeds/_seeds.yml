# Lookup tables and rules used by staging and intermediate models. Edit the
# CSV files to improve matching; see "Transformation logic" in the design doc.
#
# Every alias and keyword is written the way normalize_text leaves text:
# lowercase, no accents, final sigma written as σ, punctuation other than
# + # . replaced by a space, single spaces only.

seeds:
  - name: skills
    description: One row per skill that skill extraction can find.
    config:
      column_types:
        skill_id: text
        name: text
        category: text
    columns:
      - name: skill_id
        description: Stable slug, such as postgresql. Used as the key in every layer.
        data_tests:
          - unique
          - not_null
          - matches_pattern:
              arguments:
                pattern: "^[a-z0-9]+(_[a-z0-9]+)*$"
      - name: name
        description: Display name for the dashboard.
        data_tests:
          - unique
          - not_null
      - name: category
        description: Kind of skill.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [language, framework, database, cloud, tool]

  - name: skill_aliases
    description: >
      Words that mark a skill in a posting. An alias matches the normalized
      title or description when it stands alone, using the boundary
      (^|[^a-z0-9+#.])alias($|[^a-z0-9+#]) with the alias regex-escaped.
      So java does not match javascript, and c does not match c++ or c#.
    config:
      column_types:
        skill_id: text
        alias: text
        pattern_override: text
    columns:
      - name: skill_id
        description: The skill this alias marks.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('skills')
                field: skill_id
      - name: alias
        description: The alias in normalized form. Each alias marks one skill only.
        data_tests:
          - unique
          - not_null
          - matches_pattern:
              arguments:
                pattern: "^[a-z0-9α-ρσ-ω+#.]+( [a-z0-9α-ρσ-ω+#.]+)*$"
      - name: pattern_override
        description: >
          A full Postgres regular expression used instead of the alias and
          boundary, for names that are ambiguous on their own, such as go, r,
          c and react. Empty for most aliases.
        data_tests:
          - valid_regex

  - name: city_aliases
    description: >
      Place names found in location text, mapped to a city and region. The
      city is the metropolitan area, so Attica suburbs and Piraeus map to
      Athens. When several aliases match, the one that comes first in the
      text wins, and of those the longest, so "ηρακλειο αττικησ" beats
      "ηρακλειο" and the first of two listed cities is used. Values that match nothing
      become Unknown and show up in qa_unmapped_locations.
    config:
      column_types:
        alias: text
        city: text
        region: text
    columns:
      - name: alias
        description: The place name in normalized form, in nominative and genitive.
        data_tests:
          - unique
          - not_null
          - matches_pattern:
              arguments:
                pattern: "^[a-z0-9α-ρσ-ω]+( [a-z0-9α-ρσ-ω]+)*$"
      - name: city
        description: Canonical English city name.
        data_tests:
          - not_null
          - maps_to_one:
              arguments:
                column: region
      - name: region
        description: One of the 13 administrative regions of Greece, in English.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Attica
                  - Central Macedonia
                  - Central Greece
                  - Crete
                  - Eastern Macedonia and Thrace
                  - Epirus
                  - Ionian Islands
                  - North Aegean
                  - Peloponnese
                  - South Aegean
                  - Thessaly
                  - Western Greece
                  - Western Macedonia

  - name: company_suffixes
    description: >
      Legal forms removed from the end of a company name to build
      company_key. The name is normalized and its dots removed first, so
      "Α.Ε." and "ΑΕ" both become "αε". Suffixes are removed again and
      again until none is left, so "μονοπροσωπη αε" loses both words.
    config:
      column_types:
        suffix: text
    columns:
      - name: suffix
        description: The legal form in normalized form, without dots.
        data_tests:
          - unique
          - not_null
          - matches_pattern:
              arguments:
                pattern: "^[a-z0-9α-ρσ-ω]+( [a-z0-9α-ρσ-ω]+)*$"

  - name: company_aliases
    description: >
      Other names of the same company, mapped to one company_key so
      deduplication can block on it. Applied after the name is normalized,
      its dots removed and its legal suffixes stripped. Names not listed
      here keep that cleaned name as their key.
    config:
      column_types:
        alias: text
        company_key: text
    columns:
      - name: alias
        description: Another name of the company, cleaned the same way as company_key.
        data_tests:
          - unique
          - not_null
          - matches_pattern:
              arguments:
                pattern: "^[a-z0-9α-ρσ-ω]+( [a-z0-9α-ρσ-ω]+)*$"
      - name: company_key
        description: The key every alias maps to, in the same cleaned form.
        data_tests:
          - not_null
          - matches_pattern:
              arguments:
                pattern: "^[a-z0-9α-ρσ-ω]+( [a-z0-9α-ρσ-ω]+)*$"

  - name: work_mode_rules
    description: >
      Keywords that set work_mode. Looks in the ATS workplace field, then
      location, title and description, and stops at the first field
      with a match. No match gives unknown. The match with the highest priority wins.
      The kariera workplace field is DISABLED, PARTIALLY_REMOTE,
      TEMPORARILY_REMOTE or FULLY_REMOTE, and ^disabled$ matches only
      that whole value, not the word in a description. Greenhouse gives
      yes/no fields as "Remote: Yes", so remote is not matched before "no".
    config:
      column_types:
        pattern: text
        value: text
        priority: integer
    columns:
      - name: pattern
        description: >
          A Postgres regular expression matched on normalized text. The model
          wraps it as (^|[^a-z0-9α-ω])(pattern)($|[^a-z0-9α-ω]), so it
          matches whole words only; use [α-ω]* to match a Greek stem.
        data_tests:
          - unique
          - not_null
          - valid_regex
          - matches_pattern:
              arguments:
                pattern: "^[^A-ZΆ-Ωάέήίόύώϊϋΐΰς]*$"
      - name: value
        description: The value a match gives.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [remote, hybrid, onsite]
      - name: priority
        description: Higher wins. Rules that share a priority give the same value, so ties cannot change the result.
        data_tests:
          - not_null
          - maps_to_one:
              arguments:
                column: value

  - name: seniority_rules
    description: >
      Keywords that set seniority, matched on the title only. No match
      gives unknown, not mid (ADR-005). The match with the highest priority wins.
    config:
      column_types:
        pattern: text
        value: text
        priority: integer
    columns:
      - name: pattern
        description: >
          A Postgres regular expression matched on normalized text. The model
          wraps it as (^|[^a-z0-9α-ω])(pattern)($|[^a-z0-9α-ω]), so it
          matches whole words only; use [α-ω]* to match a Greek stem.
        data_tests:
          - unique
          - not_null
          - valid_regex
          - matches_pattern:
              arguments:
                pattern: "^[^A-ZΆ-Ωάέήίόύώϊϋΐΰς]*$"
      - name: value
        description: The value a match gives.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [intern, junior, mid, senior, lead]
      - name: priority
        description: Higher wins. Rules that share a priority give the same value, so ties cannot change the result.
        data_tests:
          - not_null
          - maps_to_one:
              arguments:
                column: value

  - name: role_family_rules
    description: >
      Keywords that set role_family. Looks in the title, then the ATS
      department. No match gives other. The match with the highest priority wins.
    config:
      column_types:
        pattern: text
        value: text
        priority: integer
    columns:
      - name: pattern
        description: >
          A Postgres regular expression matched on normalized text. The model
          wraps it as (^|[^a-z0-9α-ω])(pattern)($|[^a-z0-9α-ω]), so it
          matches whole words only; use [α-ω]* to match a Greek stem.
        data_tests:
          - unique
          - not_null
          - valid_regex
          - matches_pattern:
              arguments:
                pattern: "^[^A-ZΆ-Ωάέήίόύώϊϋΐΰς]*$"
      - name: value
        description: The value a match gives.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [data, backend, frontend, fullstack, mobile, devops, qa]
      - name: priority
        description: Higher wins. Rules that share a priority give the same value, so ties cannot change the result.
        data_tests:
          - not_null
          - maps_to_one:
              arguments:
                column: value

  - name: dedup_labels
    description: >
      Hand-labeled pairs of postings, for the dedup_precision analysis. Each
      row says whether two postings are the same real-world job. Pairs to
      label come from the dedup_label_sample analysis. Pairs whose postings
      are not in stg_postings are left out of the scores. For now these are
      draft labels for the made-up postings in tests/dedup, taken from the
      true job of each posting, until real postings are labeled.
    config:
      column_types:
        source_a: text
        source_job_id_a: text
        source_b: text
        source_job_id_b: text
        is_duplicate: boolean
    data_tests:
      - unique_combination:
          arguments:
            columns: [source_a, source_job_id_a, source_b, source_job_id_b]
    columns:
      - name: source_a
        description: Source of the first posting.
        data_tests:
          - not_null
      - name: source_job_id_a
        description: The first posting's id on its source.
        data_tests:
          - not_null
      - name: source_b
        description: Source of the second posting.
        data_tests:
          - not_null
      - name: source_job_id_b
        description: The second posting's id on its source.
        data_tests:
          - not_null
      - name: is_duplicate
        description: True when the two postings are the same real-world job.
        data_tests:
          - not_null

  - name: title_word_map
    description: >
      Words to drop or replace when building title_key, the form of the
      title that deduplication compares. Dropped words, such as gender tags
      from "(m/f)" and work mode words, say nothing about the job. Replaced
      words are synonyms that one source writes differently from another,
      such as developer and engineer. City names are dropped too, using
      city_aliases.
    config:
      column_types:
        word: text
        key_word: text
    columns:
      - name: word
        description: >
          One word of a title after normalize_text, with punctuation other
          than + and # turned into spaces.
        data_tests:
          - unique
          - not_null
          - matches_pattern:
              arguments:
                pattern: "^[a-z0-9α-ρσ-ω+#]+$"
      - name: key_word
        description: The word to use instead. Empty drops the word.
        data_tests:
          - matches_pattern:
              arguments:
                pattern: "^[a-z0-9α-ρσ-ω+#]+$"
