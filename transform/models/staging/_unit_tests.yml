  - name: stg_postings_salary
    description: >
      parse_salary reads one or two amounts, the period, basis and currency.
      Annual amounts are divided by salaries_per_year (14). Hourly pay and
      monthly amounts outside 400 to 20000 keep their labels but get no
      monthly amounts. Gross or net comes from the salary text, or else
      from a salary sentence in the description.
    model: stg_postings
    given:
      - input: ref('stg_raw_postings')
        rows:
          - {posting_key: a, salary_text: "2000 - 2500 EUR per month"}
          - {posting_key: b, salary_text: "53000 - 72000 EUR per year"}
          - {posting_key: c, salary_text: "Base salary: 56000 - 70000 EUR"}
          - {posting_key: d, salary_text: "1.200€ - 1.500€ μικτά μηνιαίως"}
          - {posting_key: e, salary_text: "Από 25.000 έως 30.000 € ετησίως καθαρά"}
          - {posting_key: f, salary_text: "25-30k gross"}
          - {posting_key: g, salary_text: "1800.50 EUR; 2500"}
          - {posting_key: h, salary_text: "1.250,50 EUR"}
          - {posting_key: i, salary_text: "£40,000 - £50,000"}
          - {posting_key: j, salary_text: "12.5 - 18 EUR per hour"}
          - {posting_key: k, salary_text: "300 EUR per month"}
          - {posting_key: l, salary_text: "Ανταγωνιστικές αποδοχές"}
          - {posting_key: m, salary_text: null}
          # Gross or net from a salary sentence in the description
          - {posting_key: n, salary_text: "2000 - 2500 EUR per month", description: "Μικτές αποδοχές 2.000 - 2.500 € μηνιαίως."}
          - {posting_key: o, salary_text: "53000 - 72000 EUR per year", description: "Gross annual salary 53,000 - 72,000 EUR."}
          - {posting_key: p, salary_text: "1500 EUR per month", description: "Καθαρές αποδοχές από 1.500 €."}
          - {posting_key: q, salary_text: "1500 EUR καθαρά", description: "Μικτές αποδοχές 2.000 €."}
          - {posting_key: r, salary_text: "2000 EUR per month", description: ".NET developer, salary 2000 EUR."}
          - {posting_key: s, salary_text: "2000 EUR per month", description: "Γράφεις καθαρό κώδικα. Μισθός 2000 €."}
          - {posting_key: t, salary_text: null, description: "Μικτές αποδοχές 1.800 - 2.200 € μηνιαίως."}
          # The Greenhouse format, with the blurb before the amounts
          - {posting_key: u, salary_text: "Base salary (Gross per year, over 14 payments.): 56000 - 70000 EUR"}
      - input: ref('city_aliases')
      - input: ref('company_suffixes')
      - input: ref('company_aliases')
      - input: ref('company_placeholders')
      - input: ref('title_word_map')
      - input: ref('work_mode_rules')
      - input: ref('seniority_rules')
      - input: ref('role_family_rules')
      - input: ref('role_family_fallback_rules')
