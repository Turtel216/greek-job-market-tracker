# dbt project for the warehouse. See "Transformation logic" in the design doc.
name: jobtracker
version: "0.1.0"
profile: jobtracker

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Salary parsing, see parse_salary. Greek pay runs over 14 payments
  # (ADR-006), so an annual amount is divided by 14 to get a month.
  salaries_per_year: 14
  # With no period keyword, an amount at least this big is annual
  salary_annual_threshold: 10000
  # Monthly amounts outside these bounds are treated as parse failures
  salary_monthly_min: 400
  salary_monthly_max: 20000
  # A posting closes once it is missing from this many successful runs of
  # its source in a row (ADR-003)
  missed_runs_to_close: 2
  # Sources with kind ats_api in config/sources.yml. Their postings are
  # preferred over job board ones when dim_jobs picks a job's primary posting.
  ats_sources: [greenhouse, lever, workable]
  # Deduplication, see int_job_candidate_pairs. Two postings of one company
  # can be the same job when they were first seen at most this many days apart.
  dedup_window_days: 30

models:
  jobtracker:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    # Marts are a contract with the dashboard, so their schemas are enforced
    marts:
      +schema: marts
      +materialized: table
      +contract:
        enforced: true

snapshots:
  jobtracker:
    +schema: snapshots

# Seeds are lookup tables for staging, so they live in the staging schema.
# The transformer role cannot create schemas of its own.
seeds:
  jobtracker:
    +schema: staging
    +quote_columns: false

flags:
  send_anonymous_usage_stats: false
