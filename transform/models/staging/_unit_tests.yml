# Unit tests for the staging models. They run in `dbt build` before the
# model they test. A seed listed under given without rows uses the real
# seed file, so the rule tests check the seeds as well as the SQL.

unit_tests:
  - name: stg_raw_postings_keys_and_text
    description: posting_key is md5 of source and id; whitespace is tidied and empty text is null.
    model: stg_raw_postings
    given:
      - input: source('raw', 'raw_postings')
        rows:
          - raw_posting_id: 1
            source: kariera
            source_job_id: "3412"
            title_raw: "Backend   Developer\n(Java)"
            company_raw: "  Aegean Payments Α.Ε. "
            salary_raw: ""
            description_raw: "  Line one\nLine two  "
          - raw_posting_id: 2
            source: greenhouse
            source_job_id: "7001"
            title_raw: Senior Data Engineer
            company_raw: "   "
            salary_raw: "Base salary: 56000 - 70000 EUR"
            description_raw: ""
      - input: ref('non_job_rules')
      - input: ref('abroad_countries')
      - input: ref('non_tech_rules')
      - input: ref('role_family_rules')
    expect:
      rows:
        - posting_key: 707c7653f4aab6dfd16c51b85a899090  # gitleaks:allow (md5, not a secret)
          raw_posting_id: 1
          title: Backend Developer (Java)
          company_name: Aegean Payments Α.Ε.
          salary_text: null
          description: "Line one\nLine two"
        - posting_key: 8a0d45a0ec9859624322e620162bd5bb  # gitleaks:allow (md5, not a secret)
          raw_posting_id: 2
          title: Senior Data Engineer
          company_name: null
          salary_text: "Base salary: 56000 - 70000 EUR"
          description: null

  - name: stg_raw_postings_newest_parse
    description: >
      After a reparse, each posting and day keeps only the row from the
      newest load. Days the reparse did not cover keep their only row.
    model: stg_raw_postings
    given:
      - input: source('raw', 'raw_postings')
        rows:
          - raw_posting_id: 1
            source: kariera
            source_job_id: "3412"
            run_date: 2026-10-25
            title_raw: Broken
            parser_version: "1"
          - raw_posting_id: 2
            source: kariera
            source_job_id: "3412"
            run_date: 2026-10-26
            title_raw: Broken
            parser_version: "1"
          - raw_posting_id: 3
            source: greenhouse
            source_job_id: "3412"
            run_date: 2026-10-25
            title_raw: Other source
            parser_version: "1"
          - raw_posting_id: 4
            source: kariera
            source_job_id: "3412"
            run_date: 2026-10-25
            title_raw: Fixed
            parser_version: "2"
      - input: ref('non_job_rules')
      - input: ref('abroad_countries')
      - input: ref('non_tech_rules')
      - input: ref('role_family_rules')
    expect:
      rows:
        - raw_posting_id: 2
          run_date: 2026-10-26
          title: Broken
          parser_version: "1"
        - raw_posting_id: 3
          run_date: 2026-10-25
          title: Other source
          parser_version: "1"
        - raw_posting_id: 4
          run_date: 2026-10-25
          title: Fixed
          parser_version: "2"

  - name: stg_raw_postings_non_jobs
    description: >
      Events, academic positions and open applications are not jobs, so
      their rows are left out. Real jobs that mention a PhD, a developer or
      joining a team stay in, and so does a row with no title.
    model: stg_raw_postings
    given:
      - input: source('raw', 'raw_postings')
        rows:
          - {raw_posting_id: 1, source: kariera, source_job_id: "1", title_raw: "Developers Day Athens 2026 - Reframe Tech"}
          - {raw_posting_id: 2, source: skywalker, source_job_id: "2", title_raw: "Master's Thesis Opportunity - Ioannina"}
          - {raw_posting_id: 3, source: skywalker, source_job_id: "3", title_raw: "Postdoc/PhD/PhD cand. in Physics/Computer Science - NIKI - Ιωάννινα"}
          - {raw_posting_id: 4, source: kariera, source_job_id: "4", title_raw: "Υποψήφιος Διδάκτορας Πληροφορικής"}
          - {raw_posting_id: 5, source: kariera, source_job_id: "5", title_raw: "Data Scientist (PhD preferred)"}
          - {raw_posting_id: 6, source: kariera, source_job_id: "6", title_raw: "Senior Developer"}
          - {raw_posting_id: 7, source: kariera, source_job_id: "7", title_raw: null}
          - {raw_posting_id: 8, source: workable, source_job_id: "8", title_raw: "Join Skroutz"}
          - {raw_posting_id: 9, source: workable, source_job_id: "9", title_raw: "Join Hack The Box (Global)"}
          - {raw_posting_id: 10, source: workable, source_job_id: "10", title_raw: "Join our Innovative Team"}
          - {raw_posting_id: 11, source: workable, source_job_id: "11", title_raw: "Express Your Interest at XTM"}
          - {raw_posting_id: 12, source: workable, source_job_id: "12", title_raw: "Join our team as a Backend Developer"}
      - input: ref('non_job_rules')
      - input: ref('abroad_countries')
      - input: ref('non_tech_rules')
      - input: ref('role_family_rules')
    expect:
      rows:
        - {raw_posting_id: 5, title: "Data Scientist (PhD preferred)"}
        - {raw_posting_id: 6, title: "Senior Developer"}
        - {raw_posting_id: 7, title: null}
        - {raw_posting_id: 12, title: "Join our team as a Backend Developer"}

  - name: stg_raw_postings_abroad
    description: >
      A job only abroad is left out. A job with any place in Greece, Cyprus
      or Malta stays in, and so does a location that names no country or
      no location at all.
    model: stg_raw_postings
    given:
      - input: source('raw', 'raw_postings')
        rows:
          - {raw_posting_id: 1, source: workable, source_job_id: "1", title_raw: A, location_raw: "Brussels, Belgium"}
          - {raw_posting_id: 2, source: workable, source_job_id: "2", title_raw: B, location_raw: "London, England, United Kingdom; Poland"}
          - {raw_posting_id: 3, source: workable, source_job_id: "3", title_raw: C, location_raw: "London, England, United Kingdom; Athens, Attica, Greece"}
          - {raw_posting_id: 4, source: workable, source_job_id: "4", title_raw: D, location_raw: "Nicosia, Cyprus"}
          - {raw_posting_id: 5, source: skywalker, source_job_id: "5", title_raw: E, location_raw: "Ελλάδα, Κύπρος, Ευρώπη, Εξωτερικό"}
          - {raw_posting_id: 6, source: kariera, source_job_id: "6", title_raw: F, location_raw: "Μαρούσι"}
          - {raw_posting_id: 7, source: kariera, source_job_id: "7", title_raw: G, location_raw: null}
      - input: ref('non_job_rules')
      - input: ref('abroad_countries')
      - input: ref('non_tech_rules')
      - input: ref('role_family_rules')
    expect:
      rows:
        - {raw_posting_id: 3, title: C}
        - {raw_posting_id: 4, title: D}
        - {raw_posting_id: 5, title: E}
        - {raw_posting_id: 6, title: F}
        - {raw_posting_id: 7, title: G}

  - name: stg_raw_postings_non_tech
    description: >
      Non-tech titles such as sales or project management are left out,
      even for software development. A tech rule on the title or department
      keeps a posting, and non-tech rules read the title only.
    model: stg_raw_postings
    given:
      - input: source('raw', 'raw_postings')
        rows:
          - {raw_posting_id: 1, source: skywalker, source_job_id: "1", title_raw: "Senior Sales Account Manager | Κύπρος"}
          - {raw_posting_id: 2, source: skywalker, source_job_id: "2", title_raw: "Υπεύθυνος Πωλήσεων & Τεχνικής Υποστήριξης Τηλεπικοινωνιακού Εξοπλισμού"}
          - {raw_posting_id: 3, source: kariera, source_job_id: "3", title_raw: "IT PROJECT COORDINATOR | SOFTWARE / IT BACKGROUND"}
          - {raw_posting_id: 4, source: kariera, source_job_id: "4", title_raw: "Project Manager - Software Development"}
          - {raw_posting_id: 5, source: kariera, source_job_id: "5", title_raw: "JUNIOR SOFTWARE COMMISSIONING ENGINEER"}
          - {raw_posting_id: 6, source: kariera, source_job_id: "6", title_raw: "Critical Environment Technician"}
          - {raw_posting_id: 7, source: kariera, source_job_id: "7", title_raw: "Τεχνικός Εγκατάστασης και Συντήρησης Συστημάτων _SCAN"}
          # A tech rule on the title wins
          - {raw_posting_id: 8, source: kariera, source_job_id: "8", title_raw: "Sales Security Engineer"}
          # A tech rule on the department wins
          - {raw_posting_id: 9, source: workable, source_job_id: "9", title_raw: "Sales Manager", department_raw: "Cloud Platform"}
          # A sales department does not drop a software engineer
          - {raw_posting_id: 10, source: skywalker, source_job_id: "10", title_raw: "Software Engineer", department_raw: "Στέλεχος Πληροφορικής, Πληροφορική, Πωλήσεις"}
          # No rule at all
          - {raw_posting_id: 11, source: kariera, source_job_id: "11", title_raw: "Digital Services Development Associate", department_raw: "IT"}
          - {raw_posting_id: 12, source: kariera, source_job_id: "12", title_raw: null}
      - input: ref('non_job_rules')
      - input: ref('abroad_countries')
      - input: ref('non_tech_rules')
      - input: ref('role_family_rules')
    expect:
      rows:
        - {raw_posting_id: 8, title: "Sales Security Engineer"}
        - {raw_posting_id: 9, title: "Sales Manager"}
        - {raw_posting_id: 10, title: "Software Engineer"}
        - {raw_posting_id: 11, title: "Digital Services Development Associate"}
        - {raw_posting_id: 12, title: null}

  - name: stg_raw_postings_non_tech_ats_titles
    description: >
      ATS sources list everything a company hires for, so legal, HR, finance,
      marketing and warehouse roles are left out. Tech titles close to them
      stay in.
    model: stg_raw_postings
    given:
      - input: source('raw', 'raw_postings')
        rows:
          - {raw_posting_id: 1, source: workable, source_job_id: "1", title_raw: "Regulatory Lawyer - Banking"}
          - {raw_posting_id: 2, source: workable, source_job_id: "2", title_raw: "Legal Counsel - Group Corporate & Operations"}
          - {raw_posting_id: 3, source: workable, source_job_id: "3", title_raw: "HR Consultant"}
          - {raw_posting_id: 4, source: workable, source_job_id: "4", title_raw: "Junior Talent Acquisition Specialist"}
          - {raw_posting_id: 5, source: workable, source_job_id: "5", title_raw: "Assistant Financial Controller"}
          - {raw_posting_id: 6, source: workable, source_job_id: "6", title_raw: "Growth Marketing Specialist"}
          - {raw_posting_id: 7, source: workable, source_job_id: "7", title_raw: "Warehouse Staff - Aspropyrgos (WSA 0926)"}
          - {raw_posting_id: 8, source: workable, source_job_id: "8", title_raw: "IT Presales Manager"}
          - {raw_posting_id: 9, source: workable, source_job_id: "9", title_raw: "Client Relationship Representative (Field-Based)"}
          # Data warehouse is a tech rule
          - {raw_posting_id: 10, source: kariera, source_job_id: "10", title_raw: "Data Warehouse Team Lead"}
          # Marketing analytics is still data analytics
          - {raw_posting_id: 11, source: kariera, source_job_id: "11", title_raw: "Marketing Data Analyst"}
          # Payroll software is not plain HR
          - {raw_posting_id: 12, source: workable, source_job_id: "12", title_raw: "HR & Payroll Software Consultant"}
      - input: ref('non_job_rules')
      - input: ref('abroad_countries')
      - input: ref('non_tech_rules')
      - input: ref('role_family_rules')
    expect:
      rows:
        - {raw_posting_id: 10, title: "Data Warehouse Team Lead"}
        - {raw_posting_id: 11, title: "Marketing Data Analyst"}
        - {raw_posting_id: 12, title: "HR & Payroll Software Consultant"}

  - name: stg_postings_normalize_text
    description: >
      normalize_text lowercases, strips Greek and Latin accents, writes the
      final sigma as a normal one, keeps + # . and turns other punctuation
      into single spaces.
    model: stg_postings
    given:
      - input: ref('stg_raw_postings')
        rows:
          - posting_key: a
            title: "Προγραμματιστής C++/C# & .NET – Αθήνα"
            description: "Γνώσεις Python,\nSQL & Docker."
          - posting_key: b
            title: "  ΥΠΕΥΘΥΝΟΣ   Ανάπτυξης_Λογισμικού (Node.js)!! "
          - posting_key: c
            title: "Προϊστάμενος Ομάδας Ποιοτικού Ελέγχου"
          - posting_key: d
            title: "Ingénieur Données, Zürich"
          - posting_key: e
            title: "---"
      - input: ref('city_aliases')
      - input: ref('company_suffixes')
      - input: ref('company_aliases')
      - input: ref('company_placeholders')
      - input: ref('title_word_map')
      - input: ref('work_mode_rules')
      - input: ref('seniority_rules')
      - input: ref('role_family_rules')
      - input: ref('role_family_fallback_rules')
    expect:
      rows:
        - {posting_key: a, title_normalized: "προγραμματιστησ c++ c# .net αθηνα", description_text: "γνωσεισ python sql docker."}
        - {posting_key: b, title_normalized: "υπευθυνοσ αναπτυξησ λογισμικου node.js", description_text: null}
        - {posting_key: c, title_normalized: "προισταμενοσ ομαδασ ποιοτικου ελεγχου", description_text: null}
        - {posting_key: d, title_normalized: "ingenieur donnees zurich", description_text: null}
        - {posting_key: e, title_normalized: null, description_text: null}

  - name: stg_postings_latest_row
    description: Each posting keeps its newest raw row, and last_run_date is that row's run_date.
    model: stg_postings
    given:
      - input: ref('stg_raw_postings')
        rows:
          - {posting_key: a, run_date: "2026-10-20", title: Backend Developer, content_hash: old}
          - {posting_key: a, run_date: "2026-10-25", title: Senior Backend Developer, content_hash: new}
          - {posting_key: a, run_date: "2026-10-22", title: Backend Engineer, content_hash: middle}
          - {posting_key: b, run_date: "2026-10-21", title: QA Engineer, content_hash: only}
      - input: ref('city_aliases')
      - input: ref('company_suffixes')
      - input: ref('company_aliases')
      - input: ref('company_placeholders')
      - input: ref('title_word_map')
      - input: ref('work_mode_rules')
      - input: ref('seniority_rules')
      - input: ref('role_family_rules')
      - input: ref('role_family_fallback_rules')
    expect:
      rows:
        - {posting_key: a, title: Senior Backend Developer, content_hash: new, last_run_date: "2026-10-25"}
        - {posting_key: b, title: QA Engineer, content_hash: only, last_run_date: "2026-10-21"}

  - name: stg_postings_title_key
    description: >
      title_key drops punctuation other than + and #, city names (also ones
      of two words) and the words title_word_map drops, and replaces the
      synonyms it lists. A title with nothing left has no key.
    model: stg_postings
    given:
      - input: ref('stg_raw_postings')
        rows:
          - {posting_key: a, title: "Sr. Backend Developer (Java) - Αθήνα (m/f)"}
          - {posting_key: b, title: "Senior Java Backend Engineer | Hybrid"}
          - {posting_key: c, title: "Προγραμματιστής C++/C# .NET, Αγία Παρασκευή"}
          - {posting_key: d, title: "Site Reliability Engineer, Thessaloniki"}
          - {posting_key: e, title: "Remote (M/F)"}
          - {posting_key: f, title: null}
      - input: ref('city_aliases')
      - input: ref('company_suffixes')
      - input: ref('company_aliases')
      - input: ref('company_placeholders')
      - input: ref('title_word_map')
      - input: ref('work_mode_rules')
      - input: ref('seniority_rules')
      - input: ref('role_family_rules')
      - input: ref('role_family_fallback_rules')
    expect:
      rows:
        - {posting_key: a, title_key: "senior backend engineer java"}
        - {posting_key: b, title_key: "senior java backend engineer"}
        - {posting_key: c, title_key: "engineer c++ c# net"}
        - {posting_key: d, title_key: "site reliability engineer"}
        - {posting_key: e, title_key: null}
        - {posting_key: f, title_key: null}

  - name: stg_postings_company_key
    description: >
      company_key drops dots and every legal suffix at the end of the name,
      then maps aliases to one key. A name that hides the employer, such as
      confidential, gets no key.
    model: stg_postings
    given:
      - input: ref('stg_raw_postings')
        rows:
          - {posting_key: a, company_name: "Aegean Payments Α.Ε."}
          - {posting_key: b, company_name: "ΟΤΕ Α.Ε."}
          - {posting_key: c, company_name: "Skroutz.gr"}
          - {posting_key: d, company_name: "Ionian Cloud Μονοπρόσωπη Ι.Κ.Ε."}
          - {posting_key: e, company_name: "Workable Software Ltd"}
          - {posting_key: f, company_name: "Netcompany-Intrasoft S.A."}
          - {posting_key: g, company_name: "S.A."}
          - {posting_key: h, company_name: null}
          - {posting_key: i, company_name: "Confidential"}
          - {posting_key: j, company_name: "Εμπιστευτικό Α.Ε."}
      - input: ref('city_aliases')
      - input: ref('company_suffixes')
      - input: ref('company_aliases')
      - input: ref('company_placeholders')
      - input: ref('title_word_map')
      - input: ref('work_mode_rules')
      - input: ref('seniority_rules')
      - input: ref('role_family_rules')
      - input: ref('role_family_fallback_rules')
    expect:
      rows:
        - {posting_key: a, company_key: aegean payments}
        - {posting_key: b, company_key: ote}
        - {posting_key: c, company_key: skroutz}
        - {posting_key: d, company_key: ionian cloud}
        - {posting_key: e, company_key: workable}
        - {posting_key: f, company_key: netcompany intrasoft}
        - {posting_key: g, company_key: sa}
        - {posting_key: h, company_key: null}
        - {posting_key: i, company_key: null}
        - {posting_key: j, company_key: null}

  - name: stg_postings_city
    description: >
      The location is tried before the title. The first place in the text
      wins, and of places that start at the same spot the longest. No
      match gives Unknown. j to l are skywalker locations, which put the
      prefecture before the municipalities.
    model: stg_postings
    given:
      - input: ref('stg_raw_postings')
        rows:
          - {posting_key: a, location_text: "Αθήνα, Αττική, Ελλάδα; Θεσσαλονίκη, Ελλάδα"}
          - {posting_key: b, location_text: "Athens, Attica, Greece"}
          - {posting_key: c, location_text: "Μαρούσι"}
          - {posting_key: d, location_text: "Ηράκλειο Αττικής"}
          - {posting_key: e, location_text: "Νέο Ηράκλειο"}
          - {posting_key: f, location_text: "Ηράκλειο, Κρήτη"}
          - {posting_key: g, location_text: "Remote - Greece", title: "Backend Engineer (Thessaloniki)"}
          - {posting_key: h, location_text: "Πάτρα", title: "Data Analyst, Athens office"}
          - {posting_key: i, location_text: null, title: "Software Engineer"}
          - {posting_key: j, location_text: "Νομός Αττικής, Βόρειος Τομέας Αθηνών, Δήμος Ηρακλείου, Δήμος Κηφισιάς, Περιφέρεια Αττικής, Ελλάδα"}
          - {posting_key: k, location_text: "Νομός Ιωαννίνων, Περιφέρεια Ηπείρου, Ελλάδα"}
          - {posting_key: l, location_text: "Ελλάδα, Κύπρος, Ευρώπη, Εξωτερικό"}
          # kariera writes the town, then the region
          - {posting_key: m, location_text: "Ευκαρπία, Κεντρική Μακεδονία, Ελλάδα"}
          # skywalker writes the prefecture, then the municipality in the genitive
          - {posting_key: n, location_text: "Νομός Κυκλάδων, Δήμος Μυκόνου, Περιφέρεια Νοτίου Αιγαίου, Ελλάδα"}
          - {posting_key: o, location_text: "Νομός Δωδεκανήσου, Δήμος Κω, Περιφέρεια Νοτίου Αιγαίου, Ελλάδα"}
          - {posting_key: p, location_text: "Νομός Λασιθίου, Δήμος Αγίου Νικολάου, Περιφέρεια Κρήτης, Ελλάδα"}
          # Athens has an Agios Nikolaos too, so only the Cretan forms are aliases
          - {posting_key: q, location_text: "Άγιος Νικόλαος, Αττική, Ελλάδα"}
          - {posting_key: r, location_text: "Νομός Πιερίας, Περιφέρεια Κεντρικής Μακεδονίας, Ελλάδα"}
          - {posting_key: s, location_text: "Λάρνακα, Λευκωσία, Κύπρος"}
          - {posting_key: t, location_text: "Λεμεσός, Κύπρος"}
          - {posting_key: u, location_text: "Μάλτα, Ευρώπη, Εξωτερικό"}
          # Paros must not match inside Antiparos
          - {posting_key: v, location_text: "Νομός Κυκλάδων, Δήμος Αντιπάρου, Περιφέρεια Νοτίου Αιγαίου, Ελλάδα"}
          - {posting_key: w, location_text: "Νομός Κυκλάδων, Δήμος Πάρου, Περιφέρεια Νοτίου Αιγαίου, Ελλάδα"}
          - {posting_key: x, location_text: "Νομός Κυκλάδων, Δήμος Θήρας, Περιφέρεια Νοτίου Αιγαίου, Ελλάδα"}
      - input: ref('city_aliases')
      - input: ref('company_suffixes')
      - input: ref('company_aliases')
      - input: ref('company_placeholders')
      - input: ref('title_word_map')
      - input: ref('work_mode_rules')
      - input: ref('seniority_rules')
      - input: ref('role_family_rules')
      - input: ref('role_family_fallback_rules')
    expect:
      rows:
        - {posting_key: a, city: Athens, region: Attica}
        - {posting_key: b, city: Athens, region: Attica}
        - {posting_key: c, city: Athens, region: Attica}
        - {posting_key: d, city: Athens, region: Attica}
        - {posting_key: e, city: Athens, region: Attica}
        - {posting_key: f, city: Heraklion, region: Crete}
        - {posting_key: g, city: Thessaloniki, region: Central Macedonia}
