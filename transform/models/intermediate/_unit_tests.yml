# Unit tests for the intermediate models. They run in `dbt build` before the
# model they test.

unit_tests:
  - name: int_posting_lifecycle_closing
    description: >
      A posting closes after it is missing from 2 successful runs of its
      source, and closed_date is the first of them. Failed runs do not
      count, and a day with one failed and one succeeded load does. A source
      with no runs in ops.ingest_runs never closes anything.
    model: int_posting_lifecycle
    given:
      - input: ref('stg_raw_postings')
        rows:
          # Seen in the latest successful run
          - {posting_key: a, source: kariera, run_date: "2026-10-01"}
          - {posting_key: a, source: kariera, run_date: "2026-10-02"}
          - {posting_key: a, source: kariera, run_date: "2026-10-05"}
          # Missing from the run on the 5th only; the 4th failed
          - {posting_key: b, source: kariera, run_date: "2026-10-01"}
          - {posting_key: b, source: kariera, run_date: "2026-10-03"}
          # Missing from the runs on the 2nd, 3rd and 5th
          - {posting_key: c, source: kariera, run_date: "2026-10-01"}
          # Missing from the runs on the 3rd and 4th
          - {posting_key: d, source: greenhouse, run_date: "2026-10-01"}
          - {posting_key: d, source: greenhouse, run_date: "2026-10-02"}
          # Missing from the run on the 4th only
          - {posting_key: e, source: greenhouse, run_date: "2026-10-03"}
          # A source with no runs recorded
          - {posting_key: f, source: lever, run_date: "2026-10-01"}
      - input: source('ops', 'ingest_runs')
        rows:
          - {source: kariera, run_id: k1, run_date: "2026-10-01", status: succeeded}
          - {source: kariera, run_id: k2, run_date: "2026-10-02", status: succeeded}
          - {source: kariera, run_id: k3, run_date: "2026-10-03", status: succeeded}
          - {source: kariera, run_id: k4, run_date: "2026-10-04", status: failed}
          - {source: kariera, run_id: k5, run_date: "2026-10-05", status: succeeded}
          - {source: greenhouse, run_id: g1, run_date: "2026-10-01", status: succeeded}
          - {source: greenhouse, run_id: g2, run_date: "2026-10-02", status: succeeded}
          - {source: greenhouse, run_id: g3, run_date: "2026-10-03", status: succeeded}
          - {source: greenhouse, run_id: g4a, run_date: "2026-10-04", status: failed}
          - {source: greenhouse, run_id: g4b, run_date: "2026-10-04", status: succeeded}
    expect:
      rows:
        - {posting_key: a, source: kariera, first_seen: "2026-10-01", last_seen: "2026-10-05", missed_runs: 0, is_open: true, closed_date: null}
        - {posting_key: b, source: kariera, first_seen: "2026-10-01", last_seen: "2026-10-03", missed_runs: 1, is_open: true, closed_date: null}
        - {posting_key: c, source: kariera, first_seen: "2026-10-01", last_seen: "2026-10-01", missed_runs: 3, is_open: false, closed_date: "2026-10-02"}
        - {posting_key: d, source: greenhouse, first_seen: "2026-10-01", last_seen: "2026-10-02", missed_runs: 2, is_open: false, closed_date: "2026-10-03"}
        - {posting_key: e, source: greenhouse, first_seen: "2026-10-03", last_seen: "2026-10-03", missed_runs: 1, is_open: true, closed_date: null}
        - {posting_key: f, source: lever, first_seen: "2026-10-01", last_seen: "2026-10-01", missed_runs: 0, is_open: true, closed_date: null}

  - name: int_posting_skills_patterns
    description: >
      Aliases match whole words, so java stays out of javascript and c out
      of c++ and c#, while c++, c#, .net and node.js count as words. Go, R,
      C and React use their pattern_override: go needs golang or a word such
      as developer next to it, r and c need context, objective c is not c,
      and react native is not react. The title wins over the description.
      Inputs are already normalized, as stg_postings gives them.
    model: int_posting_skills
    given:
      - input: ref('stg_postings')
        rows:
          - {posting_key: a, title_normalized: "senior java developer", description_text: "spring boot and postgresql. javascript is a plus."}
          - {posting_key: b, title_normalized: "c++ c# .net developer", description_text: null}
          - {posting_key: c, title_normalized: "golang engineer", description_text: "we use go and react native. let s go"}
          - {posting_key: d, title_normalized: "data analyst", description_text: "r and python sql. excel."}
          - {posting_key: e, title_normalized: "backend engineer", description_text: "you will go to the office. we value clean code."}
          - {posting_key: f, title_normalized: "full stack engineer node.js", description_text: "react typescript and aws. ci with github actions."}
          - {posting_key: g, title_normalized: "μηχανικοσ λογισμικου java", description_text: "εμπειρια σε docker και kubernetes k8s."}
          - {posting_key: h, title_normalized: "embedded c engineer", description_text: "c c++ and python"}
          - {posting_key: i, title_normalized: "objective c developer", description_text: null}
          - {posting_key: j, title_normalized: "javascript developer", description_text: null}
      - input: ref('skill_aliases')
    expect:
      rows:
        - {posting_key: a, skill_id: java, matched_in: title}
        - {posting_key: a, skill_id: spring, matched_in: description}
        - {posting_key: a, skill_id: postgresql, matched_in: description}
        - {posting_key: a, skill_id: javascript, matched_in: description}
        - {posting_key: b, skill_id: cpp, matched_in: title}
        - {posting_key: b, skill_id: csharp, matched_in: title}
        - {posting_key: b, skill_id: dotnet, matched_in: title}
        - {posting_key: c, skill_id: go, matched_in: title}
        - {posting_key: c, skill_id: react_native, matched_in: description}
        - {posting_key: d, skill_id: r, matched_in: description}
        - {posting_key: d, skill_id: python, matched_in: description}
        - {posting_key: d, skill_id: sql, matched_in: description}
        - {posting_key: d, skill_id: excel, matched_in: description}
        - {posting_key: f, skill_id: nodejs, matched_in: title}
        - {posting_key: f, skill_id: react, matched_in: description}
        - {posting_key: f, skill_id: typescript, matched_in: description}
        - {posting_key: f, skill_id: aws, matched_in: description}
        - {posting_key: f, skill_id: github_actions, matched_in: description}
        - {posting_key: g, skill_id: java, matched_in: title}
        - {posting_key: g, skill_id: docker, matched_in: description}
        - {posting_key: g, skill_id: kubernetes, matched_in: description}
        - {posting_key: h, skill_id: c, matched_in: title}
        - {posting_key: h, skill_id: cpp, matched_in: description}
        - {posting_key: h, skill_id: python, matched_in: description}
        - {posting_key: i, skill_id: objective_c, matched_in: title}
        - {posting_key: j, skill_id: javascript, matched_in: title}

  - name: int_job_candidate_pairs_rules
    description: >
      Postings pair up within one company when their titles are similar,
      they were first seen at most 30 days apart, their cities agree unless
      one is Unknown or remote, and their seniorities agree unless one is
      unknown. Postings of other companies, or with no company, never pair.
    model: int_job_candidate_pairs
    given:
      - input: ref('stg_postings')
        rows:
          # Similar titles, in English and in Greek
          - {posting_key: a1, company_key: acme, title_normalized: "senior backend engineer", city: Athens, work_mode: onsite, seniority: senior}
          - {posting_key: a2, company_key: acme, title_normalized: "senior backend engineer java", city: Athens, work_mode: onsite, seniority: senior}
          - {posting_key: a3, company_key: acme, title_normalized: "μηχανικοσ λογισμικου", city: Athens, work_mode: onsite, seniority: unknown}
          - {posting_key: a4, company_key: acme, title_normalized: "μηχανικοσ λογισμικου java", city: Athens, work_mode: onsite, seniority: unknown}
          # 30 days apart pair, 31 days apart do not
          - {posting_key: b1, company_key: beta, title_normalized: "data engineer", city: Athens, work_mode: onsite, seniority: unknown}
          - {posting_key: b2, company_key: beta, title_normalized: "data engineer", city: Athens, work_mode: onsite, seniority: unknown}
          - {posting_key: b3, company_key: beta, title_normalized: "data engineer", city: Athens, work_mode: onsite, seniority: unknown}
          # Two cities do not pair, unless one is Unknown or remote
          - {posting_key: c1, company_key: gamma, title_normalized: "data engineer", city: Athens, work_mode: onsite, seniority: unknown}
          - {posting_key: c2, company_key: gamma, title_normalized: "data engineer", city: Thessaloniki, work_mode: hybrid, seniority: unknown}
          - {posting_key: c3, company_key: gamma, title_normalized: "data engineer", city: Thessaloniki, work_mode: remote, seniority: unknown}
          - {posting_key: c4, company_key: gamma, title_normalized: "data engineer", city: Unknown, work_mode: onsite, seniority: unknown}
          # Two seniorities do not pair, unless one is unknown
          - {posting_key: d1, company_key: delta, title_normalized: "qa engineer", city: Patras, work_mode: onsite, seniority: senior}
          - {posting_key: d2, company_key: delta, title_normalized: "qa engineer", city: Patras, work_mode: onsite, seniority: junior}
          - {posting_key: d3, company_key: delta, title_normalized: "qa engineer", city: Patras, work_mode: onsite, seniority: unknown}
          # Titles below the threshold, and the same title at another company
          - {posting_key: e1, company_key: epsilon, title_normalized: "backend engineer python", city: Athens, work_mode: onsite, seniority: unknown}
          - {posting_key: e2, company_key: epsilon, title_normalized: "frontend engineer", city: Athens, work_mode: onsite, seniority: unknown}
          - {posting_key: e3, company_key: zeta, title_normalized: "backend engineer python", city: Athens, work_mode: onsite, seniority: unknown}
          # No company
          - {posting_key: n1, company_key: null, title_normalized: "devops engineer", city: Athens, work_mode: onsite, seniority: unknown}
          - {posting_key: n2, company_key: null, title_normalized: "devops engineer", city: Athens, work_mode: onsite, seniority: unknown}
      - input: ref('int_posting_lifecycle')
        rows:
          - {posting_key: a1, first_seen: "2026-10-01"}
          - {posting_key: a2, first_seen: "2026-10-05"}
          - {posting_key: a3, first_seen: "2026-10-01"}
          - {posting_key: a4, first_seen: "2026-10-01"}
          - {posting_key: b1, first_seen: "2026-10-01"}
          - {posting_key: b2, first_seen: "2026-10-31"}
          - {posting_key: b3, first_seen: "2026-11-01"}
          - {posting_key: c1, first_seen: "2026-10-01"}
          - {posting_key: c2, first_seen: "2026-10-01"}
          - {posting_key: c3, first_seen: "2026-10-01"}
          - {posting_key: c4, first_seen: "2026-10-01"}
          - {posting_key: d1, first_seen: "2026-10-01"}
          - {posting_key: d2, first_seen: "2026-10-01"}
          - {posting_key: d3, first_seen: "2026-10-01"}
          - {posting_key: e1, first_seen: "2026-10-01"}
          - {posting_key: e2, first_seen: "2026-10-01"}
          - {posting_key: e3, first_seen: "2026-10-01"}
          - {posting_key: n1, first_seen: "2026-10-01"}
          - {posting_key: n2, first_seen: "2026-10-01"}
    expect:
      rows:
        - {posting_key_a: a1, posting_key_b: a2, company_key: acme}
        - {posting_key_a: a3, posting_key_b: a4, company_key: acme}
        - {posting_key_a: b1, posting_key_b: b2, company_key: beta}
        - {posting_key_a: b2, posting_key_b: b3, company_key: beta}
        - {posting_key_a: c1, posting_key_b: c3, company_key: gamma}
        - {posting_key_a: c1, posting_key_b: c4, company_key: gamma}
        - {posting_key_a: c2, posting_key_b: c3, company_key: gamma}
        - {posting_key_a: c2, posting_key_b: c4, company_key: gamma}
        - {posting_key_a: c3, posting_key_b: c4, company_key: gamma}
        - {posting_key_a: d1, posting_key_b: d3, company_key: delta}
        - {posting_key_a: d2, posting_key_b: d3, company_key: delta}
