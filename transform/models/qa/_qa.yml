# Values the seeds do not cover yet. Each view counts the postings with a
# value, so the seeds grow from real data, most common value first. The
# internal health dashboard reads them. A view whose postings from the
# newest run add up to more than 10% of that run warns, without stopping
# the build.

models:
  - name: qa_unmapped_locations
    description: >
      Location text that matched no alias in city_aliases, so the city is
      Unknown. Remote postings are left out. One row per normalized
      location. Add the common ones to city_aliases.
    columns:
      - name: location_normalized
        description: The location after normalize_text, the form the seed uses.
        data_tests:
          - unique
          - not_null
      - name: example_location
        description: One location text as a source gave it.
      - name: postings
        description: Postings with this location.
        data_tests:
          - not_null
      - name: postings_today
        description: Postings with this location seen in the newest run.
        data_tests:
          - not_null
          - share_of_todays_postings:
              config:
                severity: warn

  - name: qa_unclassified_titles
    description: >
      Titles that matched no rule in role_family_rules, in the title or the
      department, so the role family is other. One row per normalized
      title. Add rules for the common tech roles among them.
    columns:
      - name: title_normalized
        description: The title after normalize_text, the form the rules match.
        data_tests:
          - unique
          - not_null
      - name: example_title
        description: One title as a source gave it.
      - name: postings
        description: Postings with this title.
        data_tests:
          - not_null
      - name: postings_today
        description: Postings with this title seen in the newest run.
        data_tests:
          - not_null
          - share_of_todays_postings:
              config:
                severity: warn

  - name: qa_salary_parse_failures
    description: >
      Salary text that gave no monthly amount, with the reason: no amount,
      period not converted (weekly, daily or hourly), or out of bounds (the
      monthly amount was outside salary_monthly_min and salary_monthly_max).
      One row per salary text and reason.
    data_tests:
      - unique_combination:
          arguments:
            columns: [salary_text, reason]
    columns:
      - name: salary_text
        description: The salary as the source gave it.
        data_tests:
          - not_null
      - name: reason
        description: Why no monthly amount came out.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [no amount, period not converted, out of bounds]
      - name: postings
        description: Postings with this salary text.
        data_tests:
          - not_null
      - name: postings_today
        description: Postings with this salary text seen in the newest run.
        data_tests:
          - not_null
          - share_of_todays_postings:
              config:
                severity: warn

  - name: qa_source_status
    description: >
      One row per source, as of its newest successful run in
      ops.ingest_runs: the postings seen for the first time in that run,
      the postings open now, and the postings that run closed. A posting
      closes in the run where its missed runs reach missed_runs_to_close,
      so each closing counts once. Read by the daily summary.
    columns:
      - name: source
        description: Source name from config/sources.yml.
        data_tests:
          - unique
          - not_null
      - name: last_run_date
        description: The newest run_date with a succeeded load.
        data_tests:
          - not_null
      - name: new_postings
        description: Postings first seen in that run.
        data_tests:
          - not_null
      - name: open_postings
        description: Postings open now.
        data_tests:
          - not_null
      - name: closed_postings
        description: Postings closed by that run.
        data_tests:
          - not_null
