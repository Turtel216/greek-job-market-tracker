# Run on every commit. Install with: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Strict typing only on core/ and sources/, as the design asks.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: ^ingestion/src/jobtracker_ingest/(core|sources)/
        args: [--config-file=ingestion/pyproject.toml]
        additional_dependencies:
          - beautifulsoup4==4.15.0
          - boto3==1.43.118
          - pydantic==2.14.1
          - requests==2.34.2
          - structlog==26.1.0
          - types-boto3[s3]==1.43.118
          - types-pyyaml==6.0.12.20260906
          - types-requests==2.33.0.20261006

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0
    hooks:
      # Jinja templater, see .sqlfluff for why
      - id: sqlfluff-lint
        files: ^transform/(models|snapshots|macros|analyses|tests)/.*\.sql$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
