# Source registry. This is the only list of active sources.
# A source must not be enabled until terms_reviewed_on and
# robots_reviewed_on are filled in.
sources:
  - name: greenhouse
    kind: ats_api
    # Disabled until the terms and robots.txt review is done and the
    # accounts below are filled in
    enabled: false
    base_url: https://boards-api.greenhouse.io/v1/boards
    # Board tokens of Greek tech companies, as in boards.greenhouse.io/<token>
    accounts: []
    min_delay_seconds: 3
    max_pages: 50
    render_js: false
    terms_reviewed_on: 2026-10-29
    robots_reviewed_on: 2026-10-26
    contact: papadimitrios216@gmail.com

  - name: kariera
    kind: job_board_html
    # Disabled until the maintainer signs off the terms review below and
    # fills in the two dates.
    #
    # Review notes, 2026-10-25:
    # - robots.txt allows /jobs and disallows /admin/, /_next/data/, /api/
    #   and *.json, so the adapter reads only the HTML pages.
    # - The terms (version of 2023-07-31) have no clause on bots or
    #   scraping, but section 4.2 limits use to personal job search, allows
    #   one saved copy and forbids making material available to third
    #   parties. We store pages for 30 days and publish only aggregates.
    #   Asking Kariera for written OK first is the safe route.
    # - Fixtures are made up, so no kariera content is committed.
    enabled: true
    base_url: https://www.kariera.gr/jobs
    # Listing categories, as in kariera.gr/jobs/<category>
    accounts: [it-jobs]
    # Higher than the floor while the terms question is open
    min_delay_seconds: 5
    # Per category. it-jobs had 3 pages of 50 at review time.
    max_pages: 10
    render_js: false
    terms_reviewed_on: 2026-10-25
    robots_reviewed_on: 2026-10-25
    contact:

  - name: skywalker
    # A job board, read from its RSS feed rather than HTML pages
    kind: job_board_html
    # Review notes, 2026-10-29:
    # - robots.txt allows everything for us apart from /manage/, the login
    #   and password pages, and the apply, contact and delete-account
    #   paths. Its Content-Signal line says search=yes, ai-train=no,
    #   use=reference; we train no models and publish only aggregates.
    # - The terms (in force from 2024-04-02) have no clause on bots or
    #   scraping. Like kariera's, section 5 limits use to personal job
    #   search, allows one saved copy and forbids making material available
    #   to third parties, and section 7 forbids needless load on the site.
    #   Asking skywalker for written OK first is the safe route.
    # - Posting pages answer with a Cloudflare challenge (403), which we
    #   never try to pass, so the adapter reads only the site's own RSS
    #   feed. It cuts descriptions at about 150 characters and has no
    #   salary, so skills come from the title and that short text.
    # - Fixtures are made up, so no skywalker content is committed.
    enabled: true
    base_url: https://www.skywalker.gr/el/xml/aggelies-ergasias
    # Search category ids, as in aggelies-ergasias?category=<id>.
    # 01hdtm1ff0g1rdef228eftwthm is IT.
    accounts: [01hdtm1ff0g1rdef228eftwthm]
    # Higher than the floor while the terms question is open
    min_delay_seconds: 5
    # Per category. IT had 3 pages of 25 at review time.
    max_pages: 10
    render_js: false
    terms_reviewed_on: 2026-10-29
    robots_reviewed_on: 2026-10-29
    contact:

  - name: workable
    kind: ats_api
    # Disabled until the accounts below are filled in. An enabled source
    # with no accounts would fail every day with zero listings.
    #
    # Review notes, 2026-11-05:
    # - We use only the documented public endpoint from Workable's
    #   developer docs, GET www.workable.com/api/accounts/<subdomain>. It
    #   needs no login or key, and one request returns a company's whole
    #   job list with descriptions, so we make one request per company and
    #   none per posting. The docs state no rate limits.
    # - robots.txt on www.workable.com disallows /user_password_resets,
    #   /admin, /auth/google and /j/, and not /api/. The posting pages
    #   under /j/ are never fetched. apply.workable.com disallows nothing,
    #   but we do not use it. Both say search=yes, ai-input=yes, ai-train=no
    #   in their Content-Signal line; we train no models.
    # - The Terms and Conditions (updated 2026-03-02) are an agreement with
    #   paying employers. They have no clause on bots, scraping or
    #   third party use of public postings, and apply to the Services and
    #   the Workable website, not to these public job data. Not legal
    #   advice.
    # - Fixtures are made up, so no Workable customer content is committed.
    enabled: false
    base_url: https://www.workable.com/api/accounts
    # Account subdomains of Greek tech companies, as in
    # apply.workable.com/<subdomain>. Only add a company whose careers page
    # is public, and check it is not asking to be left out.
    accounts: []
    # Higher than the floor, the docs give no rate limit
    min_delay_seconds: 5
    max_pages: 1
    render_js: false
    terms_reviewed_on: 2026-11-05
    robots_reviewed_on: 2026-11-05
    contact:

# Reviewed on 2026-10-25 and not used:
# - jobfind.gr: its terms (section 4.2e) ban bots, spiders and crawlers, and
#   section 4.3 bans repeated and systematic extraction of any part of its
#   database. That covers its RSS feed as well.
